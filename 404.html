<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | VIVEM</title>
<meta name="description" content="The page you're looking for doesn't exist or has moved.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://vivemdigital.com/">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/images/Vivem.svg">
</head>
<body>
<header id="header">
    <div class="container">
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="assets/images/Vivem.svg" alt="VIVEM Logo" class="logo-img">
            </a>
            <div class="nav-utilities">
                <button class="lang-toggle" id="lang-toggle" aria-label="Toggle language">AR</button>
            </div>
        </nav>
    </div>
</header>

<main class="notfound">
    <div class="container">
        <div class="notfound-content">
            <div class="notfound-code" dir="ltr">404</div>
            <h2>
                <span class="lang-en">Page Not Found</span>
                <span class="lang-ar">الصفحة غير موجودة</span>
            </h2>
            <p>
                <span class="lang-en">The page you're looking for doesn't exist or has moved. Let's get you back home.</span>
                <span class="lang-ar">الصفحة التي تبحث عنها غير موجودة أو تم نقلها. لنعد بك إلى الصفحة الرئيسية.</span>
            </p>
            <a href="index.html" class="btn btn-secondary">
                <span class="lang-en">Back to Home</span>
                <span class="lang-ar">العودة للرئيسية</span>
            </a>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
